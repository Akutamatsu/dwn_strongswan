charon {
    fragmentation = yes
    mobike = no
    max_ike_init_retries = 1
    retransmit_timeout = 1
    retransmit_base = 2
    retransmit_tries = 4

    filelog {
        ike_rtt {
            path = /var/log/charon_rtt.log
            ike = 2
            append = no
            flush_line = yes
            time_format = %s
        }
    }
}
